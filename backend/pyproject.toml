[project]
name = "gmail-campaign-tool"
version = "0.1.0"
description = "Local web app for managing and sending email campaigns via Gmail API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.5",
    "pydantic-settings>=2.1",
    "google-api-python-client>=2.108",
    "google-auth-oauthlib>=1.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "markdown>=3.5",
    "apscheduler>=3.10",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campaign"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
